# Sanitized snapshot of a working configuration.
# Personal values replaced with placeholders; absolute paths made relative.
# Use this as a reference, or let the first-run setup wizard generate config.yaml.
llm:
  backend: llama                # llama | lmstudio | ollama | cloud
  lmstudio_base_url: http://localhost:1234/v1
  ollama_base_url: http://localhost:11434
  cloud:
    provider: nvidia            # nvidia | openai | together | groq | custom
    base_url: https://integrate.api.nvidia.com/v1
    api_key_ref: nvidia_nim     # keyring reference name (actual key stored securely)
    model: meta/llama-3.1-90b-instruct
  model: gemma-4-E4B-it-Q4_K_M.gguf
  temperature: 0.35
  max_tokens: 512
  max_tokens_brainstorm: 1536
  stream: true
  context_window: 4096
  llama_model_path: data/models/gemma-4-E4B-it-Q4_K_M.gguf   # update to your .gguf path
  llama_n_gpu_layers: -1
  llama_port: 8012
  llama_host: 127.0.0.1
  llama_chat_format: ''
  llama_ctx_size: 8192
  llama_startup_timeout: 120
  llama_mmproj_auto: true
  llama_image_max_tokens: 2048
speech:
  whisper_model: medium
  whisper_device: cuda
  whisper_compute_type: int8_float16
  sample_rate: 16000
  push_to_talk_key: ctrl+space
  silence_threshold: 0.001
  silence_duration: 1.2
tts:
  engine: piper
  chatterbox_python: data/chatterbox_venv/Scripts/python.exe
  chatterbox_model: turbo
  chatterbox_device: auto
  temperature: 0.4
  max_tokens: 512
  chatterbox_cfg_weight: 0.0
  chatterbox_temperature: 0.8
  min_sentence_chars: 10
  piper_exe: data/piper/piper/piper.exe
  piper_model: data/voices/en_US-lessac-medium.onnx
  piper_config: ''
  piper_speaker: null
  piper_length_scale: 0.9
  kokoro_voice: af_heart
  kokoro_speed: 2.0
  pyttsx3_rate: 185
  pyttsx3_voice_index: 0
  kittentts_model: "KittenML/kitten-tts-nano-0.1"
  kittentts_voice: "expr-voice-2-f"
  kittentts_speed: 1.0
  stream_chunk_size: 80
memory:
  db_path: data/memory.db
  max_context_memories: 6
  summary_threshold: 20
  session_persistence: true
context:
  track_active_window: true
  window_poll_interval_ms: 1000
  show_in_prompt: true
  persist_window_context: true
tools:
  require_confirmation: true
  screenshot_hotkey: ctrl+shift+j
  screenshot_temp_path: data/screenshot_temp.png
search:
  searxng_url: ''
browser:
  enabled: false
  headless: true
  screenshot_path: data/browser_screenshot.png
ui:
  window_title: COMPUTER // Computer Companion
  window_width: 1100
  window_height: 750
  font_family: Consolas
  font_size: 13
  pet_enabled: true
  max_history_display: 120
personality_file: config/personality.yaml
user:
  city: "Your City"
  country: "Your Country"
  timezone: "Your/Timezone"
  date_format: DD/MM/YYYY
  temperature_unit: Celsius
  currency: USD
  language: English
  measurement_system: metric
  week_start: monday
  locale: en-US
  work_hours: 09:00-17:00
  interests:
    - coding
    - technology
